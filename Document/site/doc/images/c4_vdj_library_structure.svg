<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 960" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="diag-stripes" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2.5" />
    </pattern>

    <style>
      .main-title { font-size: 19px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
      .sub-title { font-size: 12px; font-weight: 400; fill: #64748b; }
      
      .sec-title { font-size: 14.5px; font-weight: 700; fill: #0f172a; letter-spacing: -0.2px; }
      .sec-tag { font-size: 10px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; fill: #475569; }
      
      .track-label { font-size: 11.5px; font-weight: 700; fill: #334155; }
      .track-sub { font-size: 10px; font-weight: 500; fill: #64748b; }
      
      .dim-txt { font-size: 9.5px; font-weight: 600; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .blk-title { font-size: 12px; font-weight: 700; text-anchor: middle; fill: #ffffff; letter-spacing: 0.1px; }
      .blk-sub { font-size: 9.5px; font-weight: 500; text-anchor: middle; fill: rgba(255,255,255,0.92); }
      
      .blk-linker-title { font-size: 10.5px; font-weight: 600; text-anchor: middle; fill: #475569; }
      .blk-linker-seq { font-size: 9.5px; font-weight: 800; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; letter-spacing: 0.5px; }
      
      .blk-tso-title { font-size: 11px; font-weight: 700; text-anchor: middle; fill: #b45309; }
      .blk-tso-sub { font-size: 9px; font-weight: 600; text-anchor: middle; fill: #d97706; }

      .code-pill-txt { font-size: 9.5px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .skip-pill-txt { font-size: 9px; font-weight: 600; text-anchor: middle; fill: #94a3b8; }

      .legend-txt { font-size: 11px; font-weight: 600; fill: #334155; }
      .strand-txt { font-size: 11px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; fill: #94a3b8; }
      .proj-label { font-size: 9px; font-weight: 600; fill: #64748b; text-anchor: middle; }
      .note-txt { font-size: 11px; font-weight: 500; fill: #64748b; font-style: italic; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(40, 26)">
    <rect x="0" y="2" width="4" height="38" rx="2" fill="#7c3aed" />
    <text class="main-title" x="14" y="20">DNBelab C4 scVDJ 免疫组库文库物理结构与测序机制</text>
    <text class="sub-title" x="14" y="37">5' TCR/BCR 富集片段、TSO 区段、暗反应跳过及 --customize 参数映射</text>
  </g>

  <!-- ================= SECTION 1: READ 1 STRUCTURE ================= -->
  <g transform="translate(40, 85)">
    <!-- Section Header Bar -->
    <rect x="0" y="0" width="980" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text class="sec-title" x="12" y="21">1. Read 1 结构 (条形码 + UMI + TSO + V(D)J 转录本前段)</text>
    <rect x="850" y="6" width="118" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text class="sec-tag" x="858" y="19">Read 1 (150 / 120bp)</text>

    <!-- Track 1: Non-dark Read 1 -->
    <g transform="translate(0, 48)">
      <text class="track-label" x="0" y="14">无暗反应测序 (120–150 bp 全长读取)</text>
      <text class="track-sub" x="0" y="28">120–150 bp 全长读取</text>

      <!-- Backbone Axis -->
      <line x1="170" y1="62" x2="965" y2="62" stroke="#e2e8f0" stroke-width="3"/>
      <text class="strand-txt" x="150" y="66">5&apos;</text>
      <text class="strand-txt" x="972" y="66">3&apos;</text>

      <!-- 1. Linker 1 (1-6 bp) -> x=175, w=55 -->
      <g transform="translate(175, 42)">
        <line x1="0" y1="-8" x2="55" y2="-8" stroke="#64748b" stroke-width="1"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#64748b" stroke-width="1"/>
        <line x1="55" y1="-11" x2="55" y2="-5" stroke="#64748b" stroke-width="1"/>
        <text class="dim-txt" x="27.5" y="-12">1-6 bp</text>
        <rect x="0" y="0" width="55" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text class="blk-linker-title" x="27.5" y="18">Linker 1</text>
        <text class="blk-linker-seq" x="27.5" y="32">TCTGCG</text>
        <rect x="11.5" y="47" width="32" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2,2"/>
        <text class="skip-pill-txt" x="27.5" y="59">跳过</text>
      </g>

      <!-- 2. CB1 (7-16 bp) -> x=235, w=110 -->
      <g transform="translate(235, 42)">
        <line x1="0" y1="-8" x2="110" y2="-8" stroke="#1d4ed8" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#1d4ed8" stroke-width="1.2"/>
        <line x1="110" y1="-11" x2="110" y2="-5" stroke="#1d4ed8" stroke-width="1.2"/>
        <text class="dim-txt" fill="#1d4ed8" x="55" y="-12">7-16 bp (10 bp)</text>
        <rect x="0" y="0" width="110" height="40" rx="4" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.2"/>
        <text class="blk-title" x="55" y="19">Cell Barcode 1</text>
        <text class="blk-sub" x="55" y="32">CB1 · 10 bp</text>
        <rect x="12.5" y="47" width="85" height="17" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-pill-txt" fill="#1e40af" x="55" y="59.5">cb,R1:7-16</text>
      </g>

      <!-- 3. Linker 2 (17-22 bp) -> x=350, w=55 -->
      <g transform="translate(350, 42)">
        <line x1="0" y1="-8" x2="55" y2="-8" stroke="#64748b" stroke-width="1"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#64748b" stroke-width="1"/>
        <line x1="55" y1="-11" x2="55" y2="-5" stroke="#64748b" stroke-width="1"/>
        <text class="dim-txt" x="27.5" y="-12">17-22 bp</text>
        <rect x="0" y="0" width="55" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text class="blk-linker-title" x="27.5" y="18">Linker 2</text>
        <text class="blk-linker-seq" x="27.5" y="32">CCTTCC</text>
        <rect x="11.5" y="47" width="32" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2,2"/>
        <text class="skip-pill-txt" x="27.5" y="59">跳过</text>
      </g>

      <!-- 4. CB2 (23-32 bp) -> x=410, w=110 -->
      <g transform="translate(410, 42)">
        <line x1="0" y1="-8" x2="110" y2="-8" stroke="#2563eb" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#2563eb" stroke-width="1.2"/>
        <line x1="110" y1="-11" x2="110" y2="-5" stroke="#2563eb" stroke-width="1.2"/>
        <text class="dim-txt" fill="#2563eb" x="55" y="-12">23-32 bp (10 bp)</text>
        <rect x="0" y="0" width="110" height="40" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.2"/>
        <text class="blk-title" x="55" y="19">Cell Barcode 2</text>
        <text class="blk-sub" x="55" y="32">CB2 · 10 bp</text>
        <rect x="12.5" y="47" width="85" height="17" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-pill-txt" fill="#1e40af" x="55" y="59.5">cb,R1:23-32</text>
      </g>

      <!-- 5. Linker 3 (33-37 bp) -> x=525, w=50 -->
      <g transform="translate(525, 42)">
        <line x1="0" y1="-8" x2="50" y2="-8" stroke="#64748b" stroke-width="1"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#64748b" stroke-width="1"/>
        <line x1="50" y1="-11" x2="50" y2="-5" stroke="#64748b" stroke-width="1"/>
        <text class="dim-txt" x="25" y="-12">33-37 bp</text>
        <rect x="0" y="0" width="50" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text class="blk-linker-title" x="25" y="18">Linker 3</text>
        <text class="blk-linker-seq" x="25" y="32">CGATG</text>
        <rect x="9" y="47" width="32" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2,2"/>
        <text class="skip-pill-txt" x="25" y="59">跳过</text>
      </g>

      <!-- 6. UMI (38-47 bp) -> x=580, w=110 -->
      <g transform="translate(580, 42)">
        <line x1="0" y1="-8" x2="110" y2="-8" stroke="#0f766e" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#0f766e" stroke-width="1.2"/>
        <line x1="110" y1="-11" x2="110" y2="-5" stroke="#0f766e" stroke-width="1.2"/>
        <text class="dim-txt" fill="#0f766e" x="55" y="-12">38-47 bp (10 bp)</text>
        <rect x="0" y="0" width="110" height="40" rx="4" fill="#0f766e" stroke="#115e59" stroke-width="1.2"/>
        <text class="blk-title" x="55" y="19">UMI</text>
        <text class="blk-sub" x="55" y="32">10 bp Molecular ID</text>
        <rect x="12.5" y="47" width="85" height="17" rx="3" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
        <text class="code-pill-txt" fill="#0f766e" x="55" y="59.5">umi,R1:38-47</text>
      </g>

      <!-- 7. TSO Adapter (48-60 bp) -> x=695, w=90 -->
      <g transform="translate(695, 42)">
        <line x1="0" y1="-8" x2="90" y2="-8" stroke="#d97706" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#d97706" stroke-width="1.2"/>
        <line x1="90" y1="-11" x2="90" y2="-5" stroke="#d97706" stroke-width="1.2"/>
        <text class="dim-txt" fill="#b45309" x="45" y="-12">48-60 bp (13 bp)</text>
        <rect x="0" y="0" width="90" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
        <text class="blk-tso-title" x="45" y="19">TSO 接头</text>
        <text class="blk-tso-sub" x="45" y="32">13 bp · 模板转换</text>
        <rect x="29" y="47" width="32" height="16" rx="3" fill="#fffbeb" stroke="#fef3c7"/>
        <text class="skip-pill-txt" fill="#b45309" x="45" y="59">跳过</text>
      </g>

      <!-- 8. V(D)J Transcript 5 (61-120+ bp) -> x=790, w=175 -->
      <g transform="translate(790, 42)">
        <line x1="0" y1="-8" x2="175" y2="-8" stroke="#7c3aed" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#7c3aed" stroke-width="1.2"/>
        <line x1="175" y1="-11" x2="175" y2="-5" stroke="#7c3aed" stroke-width="1.2"/>
        <text class="dim-txt" fill="#7c3aed" x="87.5" y="-12">61-120+ bp (TCR/BCR)</text>
        <rect x="0" y="0" width="175" height="40" rx="4" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.2"/>
        <text class="blk-title" x="87.5" y="19">V(D)J 转录本前段</text>
        <text class="blk-sub" x="87.5" y="32">60+ bp · TCR/BCR 前导区</text>
        <rect x="37.5" y="47" width="100" height="17" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
        <text class="code-pill-txt" fill="#7c3aed" x="87.5" y="59.5">R1,R1:61-120</text>
      </g>
    </g>

    <!-- Track 2: Dark Reaction Read 1 (Hardware Projection Guides) -->
    <g transform="translate(0, 180)">
      <!-- Projection Guides from Non-dark to Dark -->
      <rect x="175" y="-36" width="55" height="24" rx="2" fill="url(#diag-stripes)" stroke="#cbd5e1" stroke-width="0.8"/>
      <text class="proj-label" x="202.5" y="-21">SKIP</text>

      <rect x="350" y="-36" width="55" height="24" rx="2" fill="url(#diag-stripes)" stroke="#cbd5e1" stroke-width="0.8"/>
      <text class="proj-label" x="377.5" y="-21">SKIP</text>

      <rect x="525" y="-36" width="50" height="24" rx="2" fill="url(#diag-stripes)" stroke="#cbd5e1" stroke-width="0.8"/>
      <text class="proj-label" x="550" y="-21">SKIP</text>

      <rect x="695" y="-36" width="90" height="24" rx="2" fill="url(#diag-stripes)" stroke="#cbd5e1" stroke-width="0.8"/>
      <text class="proj-label" x="740" y="-21">硬件暗反应跳过</text>

      <text class="track-label" x="0" y="14">暗反应测序 (120 bp · 硬件跳过接头与 TSO)</text>
      <text class="track-sub" x="0" y="28">120 bp · 接头全部跳过</text>

      <!-- Backbone Axis -->
      <line x1="170" y1="52" x2="845" y2="52" stroke="#e2e8f0" stroke-width="3"/>
      <text class="strand-txt" x="150" y="56">5&apos;</text>
      <text class="strand-txt" x="855" y="56">3&apos;</text>

      <!-- Dark Blocks: CB1, CB2, UMI, R1 Transcript -->
      <g transform="translate(175, 32)">
        <line x1="0" y1="-6" x2="115" y2="-6" stroke="#1d4ed8" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#1d4ed8" stroke-width="1.2"/>
        <line x1="115" y1="-9" x2="115" y2="-3" stroke="#1d4ed8" stroke-width="1.2"/>
        <text class="dim-txt" fill="#1d4ed8" x="57.5" y="-10">1-10 bp (10 bp)</text>
        <rect x="0" y="0" width="115" height="40" rx="4" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.2"/>
        <text class="blk-title" x="57.5" y="19">Cell Barcode 1</text>
        <text class="blk-sub" x="57.5" y="32">CB1 · 10 bp</text>
        <rect x="15" y="47" width="85" height="17" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-pill-txt" fill="#1e40af" x="57.5" y="59.5">cb,R1:1-10</text>
      </g>

      <g transform="translate(295, 32)">
        <line x1="0" y1="-6" x2="115" y2="-6" stroke="#2563eb" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#2563eb" stroke-width="1.2"/>
        <line x1="115" y1="-9" x2="115" y2="-3" stroke="#2563eb" stroke-width="1.2"/>
        <text class="dim-txt" fill="#2563eb" x="57.5" y="-10">11-20 bp (10 bp)</text>
        <rect x="0" y="0" width="115" height="40" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.2"/>
        <text class="blk-title" x="57.5" y="19">Cell Barcode 2</text>
        <text class="blk-sub" x="57.5" y="32">CB2 · 10 bp</text>
        <rect x="15" y="47" width="85" height="17" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-pill-txt" fill="#1e40af" x="57.5" y="59.5">cb,R1:11-20</text>
      </g>

      <g transform="translate(415, 32)">
        <line x1="0" y1="-6" x2="115" y2="-6" stroke="#0f766e" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#0f766e" stroke-width="1.2"/>
        <line x1="115" y1="-9" x2="115" y2="-3" stroke="#0f766e" stroke-width="1.2"/>
        <text class="dim-txt" fill="#0f766e" x="57.5" y="-10">21-30 bp (10 bp)</text>
        <rect x="0" y="0" width="115" height="40" rx="4" fill="#0f766e" stroke="#115e59" stroke-width="1.2"/>
        <text class="blk-title" x="57.5" y="19">UMI</text>
        <text class="blk-sub" x="57.5" y="32">10 bp Molecular ID</text>
        <rect x="15" y="47" width="85" height="17" rx="3" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
        <text class="code-pill-txt" fill="#0f766e" x="57.5" y="59.5">umi,R1:21-30</text>
      </g>

      <g transform="translate(535, 32)">
        <line x1="0" y1="-6" x2="300" y2="-6" stroke="#7c3aed" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#7c3aed" stroke-width="1.2"/>
        <line x1="300" y1="-9" x2="300" y2="-3" stroke="#7c3aed" stroke-width="1.2"/>
        <text class="dim-txt" fill="#7c3aed" x="150" y="-10">31-120+ bp (TCR/BCR)</text>
        <rect x="0" y="0" width="300" height="40" rx="4" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.2"/>
        <text class="blk-title" x="150" y="19">V(D)J 转录本前段</text>
        <text class="blk-sub" x="150" y="32">60+ bp · TCR/BCR 前导区</text>
        <rect x="100" y="47" width="100" height="17" rx="3" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
        <text class="code-pill-txt" fill="#7c3aed" x="150" y="59.5">R1,R1:31-120</text>
      </g>
    </g>
  </g>

  <!-- ================= SECTION 2: READ 2 STRUCTURE ================= -->
  <g transform="translate(40, 480)">
    <!-- Section Header Bar -->
    <rect x="0" y="0" width="980" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text class="sec-title" x="12" y="21">2. Read 2 结构 (全长 TCR / BCR 目标转录本覆盖 CDR3)</text>
    <rect x="850" y="6" width="118" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text class="sec-tag" x="858" y="19">Read 2 (150 bp)</text>

    <!-- Track 1: Read 2 Full Length -->
    <g transform="translate(0, 48)">
      <text class="track-label" x="0" y="14">Read 2 标准反向转录本测序 (1–150 bp)</text>
      <text class="track-sub" x="0" y="28">150 bp 全长反向靶向测序</text>

      <!-- Backbone Axis -->
      <line x1="170" y1="52" x2="965" y2="52" stroke="#e2e8f0" stroke-width="3"/>
      <text class="strand-txt" x="150" y="56">5&apos;</text>
      <text class="strand-txt" x="972" y="56">3&apos;</text>

      <!-- Read 2 Target Transcript Block -->
      <g transform="translate(175, 32)">
        <line x1="0" y1="-6" x2="790" y2="-6" stroke="#6366f1" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#6366f1" stroke-width="1.2"/>
        <line x1="790" y1="-9" x2="790" y2="-3" stroke="#6366f1" stroke-width="1.2"/>
        <text class="dim-txt" fill="#6366f1" x="395" y="-10">1-150 bp (Full V(D)J CDR3 Coverage)</text>
        <rect x="0" y="0" width="790" height="40" rx="4" fill="#6366f1" stroke="#4f46e5" stroke-width="1.2"/>
        <text class="blk-title" x="395" y="19">全长 V(D)J 转录本 (恒定区引物延伸端)</text>
        <text class="blk-sub" x="395" y="32">150 bp · 完整覆盖 CDR3 高变区与 V-D-J 重排接合部</text>
        <rect x="345" y="47" width="100" height="17" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
        <text class="code-pill-txt" fill="#4f46e5" x="395" y="59.5">R2,R2:1-150</text>
      </g>
    </g>

    <!-- Contextual Note on scVDJ dark reaction -->
    <g transform="translate(175, 160)">
      <text class="note-txt" x="0" y="0">* 注：scVDJ 仅 Read 1 支持暗反应；Read 2 始终自第 1 位全长测序目标靶向转录本（覆盖 CDR3 高变区），无需且不支持暗反应。</text>
    </g>
  </g>

  <!-- ================= LEGEND BAR ================= -->
  <g transform="translate(40, 855)">
    <rect width="980" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Row 1 -->
    <g transform="translate(24, 20)">
      <rect x="0" y="1" width="16" height="12" rx="3" fill="#1d4ed8"/>
      <text class="legend-txt" x="24" y="11">细胞条形码 (CB1, CB2 · 10 bp)</text>
    </g>
    <g transform="translate(290, 20)">
      <rect x="0" y="1" width="16" height="12" rx="3" fill="#0f766e"/>
      <text class="legend-txt" x="24" y="11">分子标识符 (UMI · 10 bp)</text>
    </g>
    <g transform="translate(560, 20)">
      <rect x="0" y="1" width="16" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
      <text class="legend-txt" x="24" y="11">固定接头 (Linker 1, 2, 3 · 跳过)</text>
    </g>

