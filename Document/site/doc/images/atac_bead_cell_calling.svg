<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <linearGradient id="line-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title -->
  <g transform="translate(40, 28)">
    <text x="0" y="16" font-size="16" font-weight="700" fill="#0f172a">scATAC 磁珠合并与细胞识别判定流程</text>
    <text x="0" y="34" font-size="12" fill="#64748b">磁珠合并仅影响同液滴条形码聚合，全量候选细胞（含未合并单磁珠）均进入细胞识别</text>
  </g>

  <!-- Step 1: Raw Beads -->
  <g transform="translate(40, 78)">
    <rect x="0" y="0" width="680" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="64" rx="2" fill="#64748b" />
    <text x="24" y="27" font-size="14" font-weight="700" fill="#0f172a">1. 原始测序磁珠 (Raw Beads)</text>
    <text x="24" y="47" font-size="12" fill="#64748b">测序下机的全量 Barcode（包含单磁珠、多磁珠共包裹液滴及背景游离片段）</text>
    <rect x="530" y="18" width="130" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="595" y="36" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">全量原始条形码池</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="380" y1="142" x2="380" y2="168" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 2: Bead Merging -->
  <g transform="translate(40, 172)">
    <rect x="0" y="0" width="680" height="114" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="114" rx="2" fill="#2563eb" />
    <text x="24" y="27" font-size="14" font-weight="700" fill="#0f172a">2. 磁珠合并 (Bead Merging)</text>
    <text x="24" y="47" font-size="12" fill="#475569">识别同液滴共包裹磁珠并归一为单细胞标识，不丢弃任何低频或未匹配磁珠</text>
    
    <!-- Sub cards / branches inside -->
    <g transform="translate(24, 58)">
      <!-- Branch A: Merged -->
      <rect x="0" y="0" width="310" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="12" y="19" font-size="11.5" font-weight="600" fill="#1e40af">高重叠磁珠 (≥ merge_cutoff 500)</text>
      <text x="12" y="35" font-size="11" fill="#3b82f6">Jaccard 达到阈值 ➔ 合并为多磁珠细胞 (_N > 1)</text>

      <!-- Branch B: Singletons -->
      <rect x="322" y="0" width="310" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="334" y="19" font-size="11.5" font-weight="600" fill="#334155">未合并磁珠 (&lt; 500 或未达阈值)</text>
      <text x="334" y="35" font-size="11" fill="#64748b">直接作为单磁珠细胞 (_N = 1) 完整保留</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="380" y1="286" x2="380" y2="312" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(380, 299)">
    <rect x="-105" y="-9" width="210" height="18" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="0" y="4" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">汇入全量候选细胞池（无提前丢弃）</text>
  </g>

  <!-- Step 3: Cell Calling -->
  <g transform="translate(40, 316)">
    <rect x="0" y="0" width="680" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="84" rx="2" fill="#0284c7" />
    <text x="24" y="27" font-size="14" font-weight="700" fill="#0f172a">3. 细胞识别 (Cell Calling)</text>
    <text x="24" y="47" font-size="12" fill="#475569">面向池内全量候选细胞（合并细胞 + 全部单磁珠），区分真实单细胞与游离背景</text>
    <g transform="translate(24, 57)">
      <text x="0" y="15" font-size="11" font-family="ui-monospace, monospace" fill="#0369a1">--forcecells N：按 unique fragments 降序强制截取前 N 个细胞（最高优先级）</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="380" y1="400" x2="380" y2="426" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(380, 413)">
    <rect x="-130" y="-9" width="260" height="18" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="0" y="4" font-size="10" font-family="ui-monospace, monospace" font-weight="600" fill="#92400e" text-anchor="middle">--frags_cutoff &amp; --tss_cutoff (附加质控门槛)</text>
  </g>

  <!-- Step 4: Final Cells -->
  <g transform="translate(40, 430)">
    <rect x="0" y="0" width="680" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#16a34a" />
    <text x="24" y="27" font-size="14" font-weight="700" fill="#14532d">4. 最终高质有效细胞 (Final Authentic Cells)</text>
    <text x="24" y="48" font-size="12" fill="#15803d">生成过滤后 Peak-Cell 矩阵、Fragments BED 文件与质控报告，交付下游聚类与 Motif 分析</text>
  </g>
</svg>