<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 980" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <pattern id="diag-stripes" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2.5" />
    </pattern>

    <style>
      .main-title { font-size: 19px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
      .sub-title { font-size: 12px; font-weight: 400; fill: #64748b; }
      
      .sec-title { font-size: 14.5px; font-weight: 700; fill: #0f172a; letter-spacing: -0.2px; }
      .sec-tag { font-size: 10px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; fill: #475569; }
      
      .track-label { font-size: 11.5px; font-weight: 700; fill: #334155; }
      .track-sub { font-size: 10px; font-weight: 500; fill: #64748b; }
      
      .dim-txt { font-size: 9.5px; font-weight: 600; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .blk-title { font-size: 12px; font-weight: 700; text-anchor: middle; fill: #ffffff; letter-spacing: 0.1px; }
      .blk-sub { font-size: 9.5px; font-weight: 500; text-anchor: middle; fill: rgba(255,255,255,0.92); }
      
      .blk-linker-title { font-size: 10.5px; font-weight: 600; text-anchor: middle; fill: #475569; }
      .blk-linker-seq { font-size: 9.5px; font-weight: 800; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; letter-spacing: 0.5px; }
      
      .blk-ext-title { font-size: 11.5px; font-weight: 700; text-anchor: middle; fill: #334155; }
      .blk-ext-sub { font-size: 9.5px; font-weight: 500; text-anchor: middle; fill: #64748b; }

      .code-pill-txt { font-size: 9.5px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .skip-pill-txt { font-size: 9px; font-weight: 600; text-anchor: middle; fill: #94a3b8; }

      .legend-txt { font-size: 11px; font-weight: 600; fill: #334155; }
      .strand-txt { font-size: 11px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; fill: #94a3b8; }
      .proj-label { font-size: 9px; font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(40, 26)">
    <rect x="0" y="2" width="4" height="38" rx="2" fill="#0d9488" />
    <text class="main-title" x="14" y="20">DNBelab C4 scATAC-seq Library Architecture &amp; Sequencing Mechanism</text>
    <text class="sub-title" x="14" y="37">Open chromatin inserts, adapter regions, hardware dark skips, and --customize mappings</text>
  </g>

  <!-- ================= SECTION 1: READ 1 STRUCTURE ================= -->
  <g transform="translate(40, 85)">
    <!-- Section Header Bar -->
    <rect x="0" y="0" width="980" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text class="sec-title" x="12" y="21">1. Read 1 Structure (Barcodes + Extension Adapter + Insert 1)</text>
    <rect x="850" y="6" width="118" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text class="sec-tag" x="858" y="19">Read 1 (115 / 70bp)</text>

    <!-- Track 1: Non-dark Read 1 -->
    <g transform="translate(0, 48)">
      <text class="track-label" x="0" y="14">Non-Dark Sequencing (115 bp Full Read)</text>
      <text class="track-sub" x="0" y="28">115 bp Full Read</text>

      <!-- Backbone Axis -->
      <line x1="170" y1="62" x2="965" y2="62" stroke="#e2e8f0" stroke-width="3"/>
      <text class="strand-txt" x="150" y="66">5&apos;</text>
      <text class="strand-txt" x="972" y="66">3&apos;</text>

      <!-- 1. Linker 1 (1-6 bp) -> x=175, w=55 -->
      <g transform="translate(175, 42)">
        <line x1="0" y1="-8" x2="55" y2="-8" stroke="#64748b" stroke-width="1"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#64748b" stroke-width="1"/>
        <line x1="55" y1="-11" x2="55" y2="-5" stroke="#64748b" stroke-width="1"/>
        <text class="dim-txt" x="27.5" y="-12">1-6 bp</text>
        <rect x="0" y="0" width="55" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text class="blk-linker-title" x="27.5" y="18">Linker 1</text>
        <text class="blk-linker-seq" x="27.5" y="32">TCTGCG</text>
        <rect x="11.5" y="47" width="32" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2,2"/>
        <text class="skip-pill-txt" x="27.5" y="59">Skip</text>
      </g>

      <!-- 2. CB1 (7-16 bp) -> x=235, w=115 -->
      <g transform="translate(235, 42)">
        <line x1="0" y1="-8" x2="115" y2="-8" stroke="#1d4ed8" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#1d4ed8" stroke-width="1.2"/>
        <line x1="115" y1="-11" x2="115" y2="-5" stroke="#1d4ed8" stroke-width="1.2"/>
        <text class="dim-txt" fill="#1d4ed8" x="57.5" y="-12">7-16 bp (10 bp)</text>
        <rect x="0" y="0" width="115" height="40" rx="4" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.2"/>
        <text class="blk-title" x="57.5" y="19">Cell Barcode 1</text>
        <text class="blk-sub" x="57.5" y="32">CB1 · 10 bp</text>
        <rect x="15" y="47" width="85" height="17" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-pill-txt" fill="#1e40af" x="57.5" y="59.5">cb,R1:7-16</text>
      </g>

      <!-- 3. Linker 2 (17-22 bp) -> x=355, w=55 -->
      <g transform="translate(355, 42)">
        <line x1="0" y1="-8" x2="55" y2="-8" stroke="#64748b" stroke-width="1"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#64748b" stroke-width="1"/>
        <line x1="55" y1="-11" x2="55" y2="-5" stroke="#64748b" stroke-width="1"/>
        <text class="dim-txt" x="27.5" y="-12">17-22 bp</text>
        <rect x="0" y="0" width="55" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text class="blk-linker-title" x="27.5" y="18">Linker 2</text>
        <text class="blk-linker-seq" x="27.5" y="32">CCTTCC</text>
        <rect x="11.5" y="47" width="32" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2,2"/>
        <text class="skip-pill-txt" x="27.5" y="59">Skip</text>
      </g>

      <!-- 4. CB2 (23-32 bp) -> x=415, w=115 -->
      <g transform="translate(415, 42)">
        <line x1="0" y1="-8" x2="115" y2="-8" stroke="#2563eb" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#2563eb" stroke-width="1.2"/>
        <line x1="115" y1="-11" x2="115" y2="-5" stroke="#2563eb" stroke-width="1.2"/>
        <text class="dim-txt" fill="#2563eb" x="57.5" y="-12">23-32 bp (10 bp)</text>
        <rect x="0" y="0" width="115" height="40" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.2"/>
        <text class="blk-title" x="57.5" y="19">Cell Barcode 2</text>
        <text class="blk-sub" x="57.5" y="32">CB2 · 10 bp</text>
        <rect x="15" y="47" width="85" height="17" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-pill-txt" fill="#1e40af" x="57.5" y="59.5">cb,R1:23-32</text>
      </g>

      <!-- 5. Extension Adapter (33-65 bp) -> x=535, w=150 -->
      <g transform="translate(535, 42)">
        <line x1="0" y1="-8" x2="150" y2="-8" stroke="#64748b" stroke-width="1"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#64748b" stroke-width="1"/>
        <line x1="150" y1="-11" x2="150" y2="-5" stroke="#64748b" stroke-width="1"/>
        <text class="dim-txt" x="75" y="-12">33-65 bp (33 bp)</text>
        <rect x="0" y="0" width="150" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text class="blk-ext-title" x="75" y="19">Adapter Extension</text>
        <text class="blk-ext-sub" x="75" y="32">33 bp · Extension Invariant</text>
        <rect x="52" y="47" width="46" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2,2"/>
        <text class="skip-pill-txt" x="75" y="59">Skip</text>
      </g>

      <!-- 6. Genomic Insert 1 (66-115 bp) -> x=690, w=270 -->
      <g transform="translate(690, 42)">
        <line x1="0" y1="-8" x2="270" y2="-8" stroke="#0d9488" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#0d9488" stroke-width="1.2"/>
        <line x1="270" y1="-11" x2="270" y2="-5" stroke="#0d9488" stroke-width="1.2"/>
        <text class="dim-txt" fill="#0d9488" x="135" y="-12">66-115 bp (50 bp Insert)</text>
        <rect x="0" y="0" width="270" height="40" rx="4" fill="#0d9488" stroke="#0f766e" stroke-width="1.2"/>
        <text class="blk-title" x="135" y="19">Genomic Insert 1</text>
        <text class="blk-sub" x="135" y="32">50 bp · Accessible Chromatin Insert</text>
        <rect x="85" y="47" width="100" height="17" rx="3" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
        <text class="code-pill-txt" fill="#0f766e" x="135" y="59.5">R1,R1:66-115</text>
      </g>
    </g>

    <!-- Track 2: Dark Reaction Read 1 (Hardware Projection Guides) -->
    <g transform="translate(0, 180)">
      <!-- Projection Guides from Non-dark to Dark -->
      <rect x="175" y="-36" width="55" height="24" rx="2" fill="url(#diag-stripes)" stroke="#cbd5e1" stroke-width="0.8"/>
      <text class="proj-label" x="202.5" y="-21">SKIP</text>

      <rect x="355" y="-36" width="55" height="24" rx="2" fill="url(#diag-stripes)" stroke="#cbd5e1" stroke-width="0.8"/>
      <text class="proj-label" x="382.5" y="-21">SKIP</text>

      <rect x="535" y="-36" width="150" height="24" rx="2" fill="url(#diag-stripes)" stroke="#cbd5e1" stroke-width="0.8"/>
      <text class="proj-label" x="610" y="-21">Hardware Skipped</text>

      <text class="track-label" x="0" y="14">Dark Reaction (70 bp · Hardware Skips Adapters)</text>
      <text class="track-sub" x="0" y="28">70 bp Effective Sequence</text>

      <!-- Backbone Axis -->
      <line x1="170" y1="52" x2="805" y2="52" stroke="#e2e8f0" stroke-width="3"/>
      <text class="strand-txt" x="150" y="56">5&apos;</text>
      <text class="strand-txt" x="815" y="56">3&apos;</text>

      <!-- Dark Blocks: CB1, CB2, Insert 1 -->
      <g transform="translate(175, 32)">
        <line x1="0" y1="-6" x2="130" y2="-6" stroke="#1d4ed8" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#1d4ed8" stroke-width="1.2"/>
        <line x1="130" y1="-9" x2="130" y2="-3" stroke="#1d4ed8" stroke-width="1.2"/>
        <text class="dim-txt" fill="#1d4ed8" x="65" y="-10">1-10 bp (10 bp)</text>
        <rect x="0" y="0" width="130" height="40" rx="4" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.2"/>
        <text class="blk-title" x="65" y="19">Cell Barcode 1</text>
        <text class="blk-sub" x="65" y="32">CB1 · 10 bp</text>
        <rect x="22.5" y="47" width="85" height="17" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-pill-txt" fill="#1e40af" x="65" y="59.5">cb,R1:1-10</text>
      </g>

      <g transform="translate(310, 32)">
        <line x1="0" y1="-6" x2="130" y2="-6" stroke="#2563eb" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#2563eb" stroke-width="1.2"/>
        <line x1="130" y1="-9" x2="130" y2="-3" stroke="#2563eb" stroke-width="1.2"/>
        <text class="dim-txt" fill="#2563eb" x="65" y="-10">11-20 bp (10 bp)</text>
        <rect x="0" y="0" width="130" height="40" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.2"/>
        <text class="blk-title" x="65" y="19">Cell Barcode 2</text>
        <text class="blk-sub" x="65" y="32">CB2 · 10 bp</text>
        <rect x="22.5" y="47" width="85" height="17" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-pill-txt" fill="#1e40af" x="65" y="59.5">cb,R1:11-20</text>
      </g>

      <g transform="translate(445, 32)">
        <line x1="0" y1="-6" x2="350" y2="-6" stroke="#0d9488" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#0d9488" stroke-width="1.2"/>
        <line x1="350" y1="-9" x2="350" y2="-3" stroke="#0d9488" stroke-width="1.2"/>
        <text class="dim-txt" fill="#0d9488" x="175" y="-10">21-70 bp (50 bp Insert)</text>
        <rect x="0" y="0" width="350" height="40" rx="4" fill="#0d9488" stroke="#0f766e" stroke-width="1.2"/>
        <text class="blk-title" x="175" y="19">Genomic Insert 1</text>
        <text class="blk-sub" x="175" y="32">50 bp · Accessible Chromatin Insert</text>
        <rect x="125" y="47" width="100" height="17" rx="3" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
        <text class="code-pill-txt" fill="#0f766e" x="175" y="59.5">R1,R1:21-70</text>
      </g>
    </g>
  </g>

  <!-- ================= SECTION 2: READ 2 STRUCTURE ================= -->
  <g transform="translate(40, 480)">
    <!-- Section Header Bar -->
    <rect x="0" y="0" width="980" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text class="sec-title" x="12" y="21">2. Read 2 Structure (Fixed Adapter + Insert 2)</text>
    <rect x="850" y="6" width="118" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text class="sec-tag" x="858" y="19">Read 2 (69 / 50bp)</text>

    <!-- Track 1: Non-dark Read 2 -->
    <g transform="translate(0, 48)">
      <text class="track-label" x="0" y="14">Non-Dark Sequencing (69 bp Full Read)</text>
      <text class="track-sub" x="0" y="28">69 bp Full Read</text>

      <!-- Backbone Axis -->
      <line x1="170" y1="62" x2="805" y2="62" stroke="#e2e8f0" stroke-width="3"/>
      <text class="strand-txt" x="150" y="66">5&apos;</text>
      <text class="strand-txt" x="815" y="66">3&apos;</text>

      <!-- 1. Fixed Adapter (1-19 bp) -> x=175, w=140 -->
      <g transform="translate(175, 42)">
        <line x1="0" y1="-8" x2="140" y2="-8" stroke="#64748b" stroke-width="1"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#64748b" stroke-width="1"/>
        <line x1="140" y1="-11" x2="140" y2="-5" stroke="#64748b" stroke-width="1"/>
        <text class="dim-txt" x="70" y="-12">1-19 bp (19 bp)</text>
        <rect x="0" y="0" width="140" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text class="blk-ext-title" x="70" y="19">Fixed Adapter</text>
        <text class="blk-ext-sub" x="70" y="32">19 bp · Invariant</text>
        <rect x="47" y="47" width="46" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2,2"/>
        <text class="skip-pill-txt" x="70" y="59">Skip</text>
      </g>

      <!-- 2. Genomic Insert 2 (20-69 bp) -> x=320, w=470 -->
      <g transform="translate(320, 42)">
        <line x1="0" y1="-8" x2="470" y2="-8" stroke="#0d9488" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="-5" stroke="#0d9488" stroke-width="1.2"/>
        <line x1="470" y1="-11" x2="470" y2="-5" stroke="#0d9488" stroke-width="1.2"/>
        <text class="dim-txt" fill="#0d9488" x="235" y="-12">20-69 bp (50 bp Insert)</text>
        <rect x="0" y="0" width="470" height="40" rx="4" fill="#0d9488" stroke="#0f766e" stroke-width="1.2"/>
        <text class="blk-title" x="235" y="19">Genomic Insert 2</text>
        <text class="blk-sub" x="235" y="32">50 bp · Paired-end Chromatin Insert</text>
        <rect x="185" y="47" width="100" height="17" rx="3" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
        <text class="code-pill-txt" fill="#0f766e" x="235" y="59.5">R2,R2:20-69</text>
      </g>
    </g>

    <!-- Track 2: Dark Reaction Read 2 (Hardware Projection Guides) -->
    <g transform="translate(0, 180)">
      <!-- Projection Guide for Fixed Adapter -->
      <rect x="175" y="-36" width="140" height="24" rx="2" fill="url(#diag-stripes)" stroke="#cbd5e1" stroke-width="0.8"/>
      <text class="proj-label" x="245" y="-21">Hardware Skipped</text>

      <text class="track-label" x="0" y="14">Dark Reaction (50 bp · Hardware Skips Fixed Adapter)</text>
      <text class="track-sub" x="0" y="28">50 bp Full Effective Insert</text>

      <!-- Backbone Axis -->
      <line x1="170" y1="52" x2="660" y2="52" stroke="#e2e8f0" stroke-width="3"/>
      <text class="strand-txt" x="150" y="56">5&apos;</text>
      <text class="strand-txt" x="670" y="56">3&apos;</text>

      <!-- Dark Block: Insert 2 -->
      <g transform="translate(175, 32)">
        <line x1="0" y1="-6" x2="470" y2="-6" stroke="#0d9488" stroke-width="1.2"/>
        <line x1="0" y1="-9" x2="0" y2="-3" stroke="#0d9488" stroke-width="1.2"/>
        <line x1="470" y1="-9" x2="470" y2="-3" stroke="#0d9488" stroke-width="1.2"/>
        <text class="dim-txt" fill="#0d9488" x="235" y="-10">1-50 bp (50 bp Insert)</text>
        <rect x="0" y="0" width="470" height="40" rx="4" fill="#0d9488" stroke="#0f766e" stroke-width="1.2"/>
        <text class="blk-title" x="235" y="19">Genomic Insert 2</text>
        <text class="blk-sub" x="235" y="32">50 bp · Paired-end Chromatin Insert</text>
        <rect x="185" y="47" width="100" height="17" rx="3" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
        <text class="code-pill-txt" fill="#0f766e" x="235" y="59.5">R2,R2:1-50</text>
      </g>
    </g>
  </g>

  <!-- ================= LEGEND BAR ================= -->
  <g transform="translate(40, 875)">
    <rect width="980" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Row 1 -->
    <g transform="translate(24, 20)">
      <rect x="0" y="1" width="16" height="12" rx="3" fill="#1d4ed8"/>
      <text class="legend-txt" x="24" y="11">Cell Barcode (CB1, CB2 · 10 bp)</text>
    </g>
    <g transform="translate(290, 20)">
      <rect x="0" y="1" width="16" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
      <text class="legend-txt" x="24" y="11">Fixed Linkers (6 bp · Skipped)</text>
    </g>
    <g transform="translate(560, 20)">
      <rect x="0" y="1" width="16" height="12" rx="3" fill="#f1f5f9" stroke="#64748b"/>
      <text class="legend-txt" x="24" y="11">Extension / Fixed Adapter (Skipped)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(24, 48)">
      <rect x="0" y="1" width="16" height="12" rx="3" fill="#0d9488"/>
      <text class="legend-txt" x="24" y="11">Genomic Insert (Mapped to Reference Genome)</text>
    </g>
    <g transform="translate(290, 48)">
      <text class="legend-txt" fill="#64748b" font-style="italic" x="0" y="11">Note: scATAC has no UMI; deduplicated by paired genomic cut sites &amp; Cell Barcode</text>
    </g>
  </g>
</svg>